name: Offline dependencies

on:
  workflow_dispatch:
    inputs:
      target:
        description: Dependency bundle to build
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend

jobs:
  backend:
    if: inputs.target == 'all' || inputs.target == 'backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download macOS ARM64 wheels
        run: |
          python -m pip download \
            --requirement backend/requirements.txt \
            --dest backend/wheels \
            --platform macosx_11_0_arm64 \
            --platform macosx_11_0_universal2 \
            --implementation cp \
            --python-version 312 \
            --abi cp312 \
            --only-binary=:all:
      - name: Download Linux ARM64 wheels
        run: |
          python -m pip download \
            --requirement backend/requirements.txt \
            --dest backend/wheels \
            --platform manylinux_2_17_aarch64 \
            --platform manylinux2014_aarch64 \
            --implementation cp \
            --python-version 312 \
            --abi cp312 \
            --only-binary=:all:
      - uses: actions/upload-artifact@v4
        with:
          name: backend-wheels-macos-arm64
          path: |
            backend/requirements.txt
            backend/wheels

  frontend:
    if: inputs.target == 'all' || inputs.target == 'frontend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Create lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Cache every lockfile package
        env:
          npm_config_cache: ${{ github.workspace }}/frontend/.npm-offline
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const { spawnSync } = require("node:child_process");

          const lockfile = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const urls = new Set(
            Object.values(lockfile.packages)
              .map((entry) => entry.resolved)
              .filter(Boolean),
          );

          for (const url of urls) {
            const result = spawnSync("npm", ["cache", "add", url], {
              stdio: "inherit",
            });
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-cache
          include-hidden-files: true
          path: |
            frontend/package-lock.json
            frontend/.npm-offline
